<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Hoja de vida y portafolio profesional de Alexander Andres Londono Espejo, Senior Software Engineer especializado en Java, Spring Boot, microservicios y cloud.">
    <title>Alexander Andres Londono Espejo | Senior Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="page-shell">
      <nav class="topbar no-print" aria-label="Resume controls">
        <a class="brand-mark" href="#top" aria-label="Alexander resume home">AL</a>
        <div class="control-group" role="group" aria-label="Page preferences">
          <button class="control-button is-active" type="button" data-lang-option="es" aria-pressed="true">ES</button>
          <button class="control-button" type="button" data-lang-option="en" aria-pressed="false">EN</button>
          <button class="icon-button" type="button" data-theme-toggle aria-label="Cambiar tema">
            <span aria-hidden="true" data-theme-icon><i data-lucide="moon"></i></span>
          </button>
          <button class="download-button" type="button" data-print>
            <i data-lucide="printer" aria-hidden="true"></i>
            <span data-i18n="actions.pdf">Descargar PDF</span>
          </button>
        </div>
      </nav>

      <main id="top" class="resume" aria-live="polite">
        <header class="hero">
          <div class="hero-main">
            <p class="eyebrow" data-i18n="hero.eyebrow">Hoja de vida profesional 2026</p>
            <h1 data-i18n="profile.name">Alexander Andres Londono Espejo</h1>
            <p class="role" data-i18n="profile.role">Senior Java & Software Engineer</p>
            <p class="summary-lead" data-i18n="summary.body"></p>
          </div>
          <aside class="hero-panel" aria-label="Professional status">
            <span class="status-badge" data-i18n="profile.status">Java Developer at British Airways</span>
            <dl class="quick-stats" data-render="stats"></dl>
          </aside>
        </header>

        <section class="contact-strip" aria-label="Contact information" data-render="contacts"></section>

        <div class="content-grid">
          <aside class="side-column">
            <section class="section-block">
              <div class="section-heading">
                <i class="section-icon" data-lucide="braces" aria-hidden="true"></i>
                <p data-i18n="sections.skills">Habilidades tecnicas</p>
              </div>
              <div class="skills-stack" data-render="skills"></div>
            </section>

            <section class="section-block">
              <div class="section-heading">
                <i class="section-icon" data-lucide="graduation-cap" aria-hidden="true"></i>
                <p data-i18n="sections.education">Educacion y certificaciones</p>
              </div>
              <div class="compact-list" data-render="education"></div>
            </section>

            <section class="section-block">
              <div class="section-heading">
                <i class="section-icon" data-lucide="languages" aria-hidden="true"></i>
                <p data-i18n="sections.languages">Idiomas</p>
              </div>
              <div class="language-list" data-render="languages"></div>
            </section>
          </aside>

          <div class="main-column">
            <section class="section-block">
              <div class="section-heading">
                <span>01</span>
                <i class="section-icon" data-lucide="briefcase-business" aria-hidden="true"></i>
                <p data-i18n="sections.experience">Experiencia laboral</p>
              </div>
              <div class="timeline" data-render="experience"></div>
            </section>

            <section class="section-block">
              <div class="section-heading">
                <span>02</span>
                <i class="section-icon" data-lucide="folder-kanban" aria-hidden="true"></i>
                <p data-i18n="sections.projects">Proyectos destacados</p>
              </div>
              <div class="project-grid" data-render="projects"></div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@0.468.0"></script>
    <script src="./script.js?v=dd472ca"></script>
  </body>
</html>
